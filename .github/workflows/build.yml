name: build

on:
  push:
    branches: [main]
    # a change to the documents alone builds and publishes nothing (content/texts.md is content: it builds)
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

# read-only by default; only the jobs that publish get write access
permissions:
  contents: read

# a new push waits for the running build instead of cancelling it: a release is never cut off half-published
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Fetch fonts (Amiri, Cairo) to embed offline
        # versions come from deps/fonts (with its lockfile when present): the CSS of these packages goes into the app
        run: |
          mkdir -p fonts && cp deps/fonts/package*.json fonts/ && cd fonts
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund; fi
      - name: Build
        run: scripts/ci_run.sh "build.py" python3 build.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      - name: End-to-end test (Chromium, fake mic)
        run: |
          scripts/ci_run.sh "pip" python -m pip install -q playwright==1.49.1
          scripts/ci_run.sh "playwright install" python -m playwright install --with-deps chromium
          (python -m http.server -d www 8765 >/dev/null 2>&1 &)
          for i in $(seq 40); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 0.5; done
          scripts/ci_run.sh "e2e" python tests/e2e.py
          scripts/ci_run.sh "e2e features" python tests/e2e_features.py
          scripts/ci_run.sh "e2e data" python tests/e2e_data.py
          scripts/ci_run.sh "e2e fixes" python tests/e2e_fixes.py
          scripts/ci_run.sh "e2e decisions" python tests/e2e_decisions.py
          scripts/ci_run.sh "e2e lesson" python tests/e2e_lesson.py
          scripts/ci_run.sh "e2e review 6" python tests/e2e_review6.py
          scripts/ci_run.sh "e2e review 7" python tests/e2e_review7.py
          scripts/ci_run.sh "e2e review 8" python tests/e2e_review8.py
          scripts/ci_run.sh "service worker" node tests/sw_check.js www/sw.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: www, path: www }
      - run: cp "dist/أنشودتي.html" dist/Anasheed.html
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: html, path: dist/Anasheed.html }

  webkit:
    # Safari's engine: the closest CI gets to an iPhone
    needs: web
    runs-on: ubuntu-24.04   # Playwright's WebKit libraries are packaged for 24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: www, path: www }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: '3.12' }
      - name: Install Playwright
        timeout-minutes: 3
        run: scripts/ci_run.sh "pip" python -m pip install -q playwright==1.49.1
      - name: Install WebKit
        # the Ubuntu mirror is sometimes very slow: no inner time limit (cutting it left apt-get holding the dpkg lock
        # and broke the retry); wait for any apt to finish, then one retry
        timeout-minutes: 25
        run: |
          wait_apt() { for i in $(seq 120); do sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1 || return 0; sleep 5; done; }
          wait_apt; python -m playwright install --with-deps webkit \
            || { sleep 20; wait_apt; scripts/ci_run.sh "webkit install" python -m playwright install --with-deps webkit; }
      - name: WebKit smoke test
        timeout-minutes: 6
        run: |
          (python -m http.server -d www 8765 >/dev/null 2>&1 &)
          for i in $(seq 40); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 0.5; done
          scripts/ci_run.sh "webkit" timeout 330 python -u tests/webkit_smoke.py webkit

  android:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: www, path: www }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: 21 }
      - run: if [ -f package-lock.json ]; then scripts/ci_run.sh "npm ci" npm ci --no-audit --no-fund --ignore-scripts; else scripts/ci_run.sh "npm install" npm install --no-audit --no-fund --ignore-scripts; fi
      - run: scripts/ci_run.sh "cap add" npx cap add android
      - name: Signing key from secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          HAS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          AS_VAR: ${{ vars.ANDROID_KEYSTORE != '' }}
          PW_VAR: ${{ vars.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$AS_VAR" = true ] || [ "$PW_VAR" = true ]; then
            echo "::warning title=Variables::مفتاح التوقيع أو كلمة مروره ما زال في تبويب Variables (المفتاح: $AS_VAR · كلمة المرور: $PW_VAR). احذفهما منه؛ البناء يقرأ من Secrets فقط."
          else
            echo "::notice title=Variables::تبويب Variables خالٍ من مفتاح التوقيع وكلمة مروره."
          fi
          if [ -z "$KS" ]; then
            echo "::error title=signing key::السر ANDROID_KEYSTORE غير موجود (كلمة المرور موجودة: $HAS_PW · أُضيف كمتغير Variable بدل Secret: $AS_VAR). أضفه في Settings ← Secrets and variables ← Actions ← تبويب Secrets ← Repository secrets"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - run: scripts/ci_run.sh "patch" python3 scripts/patch_android.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: scripts/ci_run.sh "cap sync" npx cap sync android
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Gradle assemble (retries if Maven Central rate-limits)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ../scripts/ci_run.sh "gradle" ./gradlew assembleRelease assembleDebug --no-daemon && exit 0; echo "retry $i"; sleep 45; done
          exit 1
      - run: |
          mkdir -p out test-apk
          cp android/app/build/outputs/apk/release/app-release.apk "out/Anasheed-${APP_VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk test-apk/anasheed-debug.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: android, path: out/*.apk }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: android-test, path: test-apk/*.apk }

  android-device:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: android-test, path: apk }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: android, path: release }
      - name: The published APK — its key, not debuggable, its version; and the previous release to update from
        env:
          GH_TOKEN: ${{ github.token }}
          # the certificate of the release key (public: anyone can read it from the APK), and the old key that was published by mistake
          RELEASE_CERT: 8e26513c2f55e80b13e16deb97352552faf336dc5b57d89c7b66c9b7481e80d9
          LEAKED_CERT: 4a2c9522830e406fc793fb11ccf21e942cdeb9dec76904ccde96b0dde4ae9856
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls release/*.apk | head -1)
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/certs.txt"
          SHA=$(grep -i 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ "$SHA" = "$LEAKED_CERT" ]; then echo "::error title=signing::the APK is signed with the old key that was published"; exit 1; fi
          if [ "$SHA" != "$RELEASE_CERT" ]; then echo "::error title=signing::the APK is not signed with the release key ($SHA)"; exit 1; fi
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then echo "::error title=debuggable::the release APK is debuggable"; exit 1; fi
          grep -q "versionName='$APP_VERSION'" "$RUNNER_TEMP/badging.txt" || { echo "::error title=version::the APK is not version $APP_VERSION"; exit 1; }
          echo "::notice title=release APK::signed with the release key, not debuggable, version $APP_VERSION"
          mkdir -p prev
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '[.assets[] | select(.name | endswith(".apk"))][0].id' 2>/dev/null || true)
          if [ -n "$ID" ] && [ "$ID" != null ]; then gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ID" > prev/previous.apk || rm -f prev/previous.apk; fi
          if [ -s prev/previous.apk ]; then echo "previous release: $(stat -c %s prev/previous.apk) bytes"; else echo "::warning title=update::no previous release APK: the update over it is not tested"; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pip install --break-system-packages -q websocket-client==1.8.0 || pip install -q websocket-client==1.8.0
      - name: Run the APK on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: |
            python3 tests/android_device.py apk/*.apk $RUNNER_TEMP/device
            python3 tests/android_release.py release/*.apk $RUNNER_TEMP/device prev/previous.apk
      - name: Results summary
        if: always()
        run: echo "::notice title=device results::$(head -c 3500 $RUNNER_TEMP/device/results.json | awk 'BEGIN{ORS="%0A"}{print}')"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with: { name: device-results, path: '${{ runner.temp }}/device' }

  device-results:
    # the only job that writes to the repository runs no third-party code: it just publishes the screenshots
    needs: android-device
    # it publishes the device screenshots even when the device test failed, but not when no APK was ever built
    if: always() && needs.android-device.result != 'skipped' && needs.android-device.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: device-results, path: device }
      - name: Publish results to branch ci-device
        run: |
          cd device && git init -q && git checkout -q -b ci-device
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "device run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-device

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: html, path: electron/app }
      - name: The Windows app uses the self-contained page (pictures inside, works from file://)
        shell: bash
        run: mv electron/app/Anasheed.html electron/app/index.html
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Build Windows installer + portable exe
        working-directory: electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p build && cp ../icons/icon.ico build/icon.ico
          if [ -f package-lock.json ]; then ../scripts/ci_run.sh "npm ci" npm ci --no-audit --no-fund; else ../scripts/ci_run.sh "npm install" npm install --no-audit --no-fund; fi
          ../scripts/ci_run.sh "electron-builder" npx electron-builder --win --publish never -c.extraMetadata.version=$APP_VERSION
      - name: Smoke test the Windows app
        shell: bash
        run: |
          set +e
          EXE=$(find electron/out -maxdepth 2 -name '*.exe' -path '*unpacked*' | head -1)
          echo "::notice title=windows out::$(find electron/out -maxdepth 2 | head -30 | awk 'BEGIN{ORS="%0A"}{print}')"
          [ -z "$EXE" ] && { echo "::error title=windows smoke::no unpacked exe"; exit 1; }
          ANASHEED_SMOKE="$PWD/smoke.json" /usr/bin/timeout 90 "$EXE" --enable-logging > run.log 2>&1 || echo "exit code $?" >> run.log
          if [ ! -f smoke.json ]; then echo "::error title=windows smoke::no smoke.json%0A$(tail -n 30 run.log | awk 'BEGIN{ORS="%0A"}{print}')"; exit 1; fi
          echo "::notice title=smoke result::$(cat smoke.json) $(head -c 1500 smoke.json.log 2>/dev/null | awk 'BEGIN{ORS="%0A"}{print}')"
          node -e "const f=require('./smoke.json'); const bad=['secure','mic','recorder','idb','amiri'].filter(k=>!f[k]); if((f.cards||0)<30||bad.length){console.log('::error title=windows smoke::'+JSON.stringify(f)); process.exit(1)} console.log('windows smoke ok')"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: windows, path: electron/out/*.exe }

  pages:
    needs: [web, webkit]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: www, path: www }
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    # nothing ships unless every test passed: Chromium, Safari's engine, the APK on the emulator, and the Windows app
    needs: [web, webkit, android, android-device, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { path: art }
      - run: ls -R art | grep -E "apk|exe|html"
      # the release action is pinned to one exact version; it only uploads the files built and tested above
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: أنشودتي ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            art/android/*.apk
            art/windows/*.exe
            art/html/*.html
          body: |
            **أندرويد (هاتف/تابلت):** نزّل ملف `.apk` وافتحه، واسمح بالتثبيت من مصادر غير معروفة إن طُلب.
            **ويندوز:** `Anasheed-Setup` للتثبيت، أو `Anasheed-Portable` للتشغيل دون تثبيت. إن ظهرت رسالة «Windows protected your PC» اضغط More info ← Run anyway.
            **ملف واحد:** `Anasheed.html` للمعاينة السريعة (التسجيل لا يعمل فيه على الهاتف).
