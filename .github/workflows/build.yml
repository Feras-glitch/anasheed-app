name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch fonts (Amiri, Cairo) to embed offline
        run: mkdir -p fonts && cd fonts && npm init -y >/dev/null && npm i @fontsource/amiri@5 @fontsource/cairo@5
      - name: Build
        run: python3 build.py
      - name: End-to-end test (Chromium, fake mic)
        run: |
          pip install playwright==1.49.1 >/dev/null
          python3 -m playwright install --with-deps chromium >/dev/null
          (python3 -m http.server -d www 8765 >/dev/null 2>&1 &)
          sleep 1
          python3 tests/e2e.py
      - uses: actions/upload-artifact@v4
        with: { name: www, path: www }
      - uses: actions/upload-artifact@v4
        with: { name: html, path: dist }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
      - run: npx cap sync android
      - name: Gradle assemble
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/Anasheed-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: www, path: electron/app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build Windows installer + portable exe
        working-directory: electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p build && cp ../icons/icon.ico build/icon.ico
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never -c.extraMetadata.version=$APP_VERSION
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: electron/out/*.exe }

  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: ls -R art | grep -E "apk|exe|html"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: أنشودتي ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            art/android/*.apk
            art/windows/*.exe
            art/html/*.html
          body: |
            **أندرويد (هاتف/تابلت):** نزّل ملف `.apk` وافتحه، واسمح بالتثبيت من مصادر غير معروفة إن طُلب.
            **ويندوز:** `Anasheed-Setup` للتثبيت، أو `Anasheed-Portable` للتشغيل دون تثبيت. إن ظهرت رسالة «Windows protected your PC» اضغط More info ← Run anyway.
            **ملف واحد:** `أنشودتي.html` للمعاينة السريعة (التسجيل لا يعمل فيه على الهاتف).
