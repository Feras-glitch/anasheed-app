name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch fonts (Amiri, Cairo) to embed offline
        run: mkdir -p fonts && cd fonts && npm init -y >/dev/null && npm i @fontsource/amiri@5 @fontsource/cairo@5
      - name: Build
        run: scripts/ci_run.sh "build.py" python3 build.py
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: End-to-end test (Chromium, fake mic)
        run: |
          scripts/ci_run.sh "pip" python -m pip install -q playwright==1.49.1
          scripts/ci_run.sh "playwright install" python -m playwright install --with-deps chromium
          (python -m http.server -d www 8765 >/dev/null 2>&1 &)
          sleep 1
          scripts/ci_run.sh "e2e" python tests/e2e.py
          scripts/ci_run.sh "e2e features" python tests/e2e_features.py
      - uses: actions/upload-artifact@v4
        with: { name: www, path: www }
      - run: cp "dist/أنشودتي.html" dist/Anasheed.html
      - uses: actions/upload-artifact@v4
        with: { name: html, path: dist/Anasheed.html }

  webkit:
    # Safari's engine: the closest CI gets to an iPhone
    needs: web
    runs-on: ubuntu-24.04   # Playwright's WebKit libraries are packaged for 24.04
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Playwright
        timeout-minutes: 3
        run: scripts/ci_run.sh "pip" python -m pip install -q playwright==1.49.1
      - name: Install WebKit
        timeout-minutes: 6
        run: scripts/ci_run.sh "webkit install" python -m playwright install --with-deps webkit
      - name: WebKit smoke test
        timeout-minutes: 6
        run: |
          (python -m http.server -d www 8765 >/dev/null 2>&1 &)
          sleep 1
          scripts/ci_run.sh "webkit" timeout 330 python -u tests/webkit_smoke.py webkit

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: scripts/ci_run.sh "npm install" npm install --no-audit --no-fund
      - run: scripts/ci_run.sh "cap add" npx cap add android
      - name: Signing key from secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          SNAMES: ${{ toJSON(secrets) }}
          VNAMES: ${{ toJSON(vars) }}
        run: |
          if [ -z "$KS" ]; then
            s=$(echo "$SNAMES" | jq -r 'keys|join(", ")'); v=$(echo "$VNAMES" | jq -r 'keys|join(", ")')
            echo "::error title=signing key::السر ANDROID_KEYSTORE غير موجود. الأسرار التي يراها البناء: [$s] — المتغيرات: [$v]"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - run: scripts/ci_run.sh "patch" python3 scripts/patch_android.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: scripts/ci_run.sh "cap sync" npx cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle assemble (retries if Maven Central rate-limits)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ../scripts/ci_run.sh "gradle" ./gradlew assembleDebug --no-daemon && exit 0; echo "retry $i"; sleep 45; done
          exit 1
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk "out/Anasheed-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  android-device:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android, path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pip install --break-system-packages -q websocket-client || pip install -q websocket-client
      - name: Run the APK on an Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: python3 tests/android_device.py apk/*.apk $RUNNER_TEMP/device
      - name: Publish results to branch ci-device
        if: always()
        run: |
          echo "::notice title=device results::$(head -c 3500 $RUNNER_TEMP/device/results.json | awk 'BEGIN{ORS="%0A"}{print}')"
          cd $RUNNER_TEMP/device && git init -q && git checkout -q -b ci-device
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "device run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-device

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: html, path: electron/app }
      - name: The Windows app uses the self-contained page (pictures inside, works from file://)
        shell: bash
        run: mv electron/app/Anasheed.html electron/app/index.html
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build Windows installer + portable exe
        working-directory: electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p build && cp ../icons/icon.ico build/icon.ico
          ../scripts/ci_run.sh "npm install" npm install --no-audit --no-fund
          ../scripts/ci_run.sh "electron-builder" npx electron-builder --win --publish never -c.extraMetadata.version=$APP_VERSION
      - name: Smoke test the Windows app
        shell: bash
        run: |
          set +e
          EXE=$(find electron/out -maxdepth 2 -name '*.exe' -path '*unpacked*' | head -1)
          echo "::notice title=windows out::$(find electron/out -maxdepth 2 | head -30 | awk 'BEGIN{ORS="%0A"}{print}')"
          [ -z "$EXE" ] && { echo "::error title=windows smoke::no unpacked exe"; exit 1; }
          ANASHEED_SMOKE="$PWD/smoke.json" /usr/bin/timeout 90 "$EXE" --enable-logging > run.log 2>&1 || echo "exit code $?" >> run.log
          if [ ! -f smoke.json ]; then echo "::error title=windows smoke::no smoke.json%0A$(tail -n 30 run.log | awk 'BEGIN{ORS="%0A"}{print}')"; exit 1; fi
          echo "::notice title=smoke result::$(cat smoke.json) $(head -c 1500 smoke.json.log 2>/dev/null | awk 'BEGIN{ORS="%0A"}{print}')"
          node -e "const f=require('./smoke.json'); const bad=['secure','mic','recorder','idb','amiri'].filter(k=>!f[k]); if((f.cards||0)<31||bad.length){console.log('::error title=windows smoke::'+JSON.stringify(f)); process.exit(1)} console.log('windows smoke ok')"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: electron/out/*.exe }

  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - run: ls -R art | grep -E "apk|exe|html"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: أنشودتي ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            art/android/*.apk
            art/windows/*.exe
            art/html/*.html
          body: |
            **أندرويد (هاتف/تابلت):** نزّل ملف `.apk` وافتحه، واسمح بالتثبيت من مصادر غير معروفة إن طُلب.
            **ويندوز:** `Anasheed-Setup` للتثبيت، أو `Anasheed-Portable` للتشغيل دون تثبيت. إن ظهرت رسالة «Windows protected your PC» اضغط More info ← Run anyway.
            **ملف واحد:** `Anasheed.html` للمعاينة السريعة (التسجيل لا يعمل فيه على الهاتف).
