name: lockfiles

# run by hand: resolves the exact versions of every npm package (and of their own dependencies) once,
# so that each build installs the same files instead of whatever is newest that day
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Resolve lockfiles without running any package script
        run: |
          for d in . electron deps/fonts; do (cd "$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund); done
          mkdir -p out/electron out/deps/fonts
          cp package-lock.json out/ && cp electron/package-lock.json out/electron/ && cp deps/fonts/package-lock.json out/deps/fonts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: lockfiles, path: out }
