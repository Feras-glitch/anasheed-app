name: lockfiles

# run by hand: resolves the exact versions of every npm package (and of their own dependencies) once,
# so that each build installs the same files instead of whatever is newest that day
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - name: Resolve lockfiles without running any package script
        run: |
          for d in . electron deps/fonts; do (cd "$d" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund); done
          mkdir -p out/electron out/deps/fonts
          cp package-lock.json out/ && cp electron/package-lock.json out/electron/ && cp deps/fonts/package-lock.json out/deps/fonts/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with: { name: lockfiles, path: out }

  publish:
    # puts the three lockfiles on the branch «lockfiles», to be reviewed and merged by hand; runs no package code
    needs: lock
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: lockfiles, path: out }
      - run: |
          cd out && git init -q && git checkout -q -b lockfiles
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "lockfiles ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lockfiles
